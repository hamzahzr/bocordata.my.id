<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel — BocorData.my.id</title><link rel="stylesheet" href="style.css">
<style>
.admin-wrap{width:min(1100px,92%);margin:auto;padding:42px 0}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.admin-actions{display:flex;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:#0e1319;border:1px solid #242d37;border-radius:16px;padding:20px}.stat b{display:block;font-size:30px;margin-top:5px}.users{background:#0e1319;border:1px solid #242d37;border-radius:18px;overflow:hidden}.user-row{display:grid;grid-template-columns:1.3fr 1.5fr .8fr .8fr 1.3fr;gap:14px;padding:16px 20px;border-bottom:1px solid #1c242d;align-items:center}.user-row.head{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#7f8a97}.user-row:last-child{border-bottom:0}.pill{display:inline-block;padding:6px 10px;border-radius:99px;border:1px solid #34404c;font-size:11px}.actions{display:flex;gap:8px}.btn{height:38px;padding:0 12px;border-radius:9px;background:#18202a;color:#e8edf2;border:1px solid #303b47}.btn.approve{background:#173323;border-color:#285b3d}.btn.reject{background:#35191b;border-color:#663337}.notice{padding:16px;border-radius:12px;background:#121820;color:#9da8b4;margin-bottom:18px}.errorbox{color:#ffb5b5}.empty{text-align:center;padding:35px;color:#7f8a97}@media(max-width:700px){.stats{grid-template-columns:1fr}.user-row{grid-template-columns:1fr 1fr}.user-row.head{display:none}.actions{flex-wrap:wrap}.admin-top{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">B</div><div><strong>BocorData.my.id</strong><span>ADMINISTRATION</span></div></div><div class="admin-actions"><button class="ghost" id="backBtn">Dashboard</button><button class="ghost" id="logout">Keluar</button></div></header>
<main class="admin-wrap"><div class="admin-top"><div><div class="eyebrow">ADMIN PANEL</div><h1>Manajemen pengguna</h1><p class="muted">Tinjau dan setujui permintaan pendaftaran akun.</p></div><button class="primary" id="refresh">↻ Refresh</button></div>
<div id="notice" class="notice hidden"></div><section class="stats"><div class="stat"><span class="muted">Menunggu</span><b id="pending">0</b></div><div class="stat"><span class="muted">Disetujui</span><b id="approved">0</b></div><div class="stat"><span class="muted">Ditolak</span><b id="rejected">0</b></div></section>
<section class="users"><div class="user-row head"><div>Nama</div><div>Email</div><div>Status</div><div>Daftar</div><div>Aksi</div></div><div id="list"><div class="empty">Memuat pengguna…</div></div></section></main>
<script>
const notice=document.getElementById('notice');const list=document.getElementById('list');
function msg(t,error=false){notice.textContent=t;notice.classList.remove('hidden');notice.classList.toggle('errorbox',error);setTimeout(()=>notice.classList.add('hidden'),3500)}
async function load(){try{const r=await fetch('/api/admin.php',{credentials:'same-origin'});const d=await r.json();if(r.status===401||r.status===403){location.href='/';return}if(!r.ok)throw Error(d.error||'Gagal memuat pengguna');const users=d.users||[];pending.textContent=users.filter(x=>x.status==='pending').length;approved.textContent=users.filter(x=>x.status==='approved').length;rejected.textContent=users.filter(x=>x.status==='rejected').length;list.innerHTML=users.map(u=>{const date=new Date(u.created_at).toLocaleDateString('id-ID');const actions=u.role==='admin'?'<span class="pill">Administrator</span>':u.status==='pending'?`<div class="actions"><button class="btn approve" onclick="act('${u.id}','approve')">Setujui</button><button class="btn reject" onclick="act('${u.id}','reject')">Tolak</button></div>`:'<span class="muted">—</span>';return `<div class="user-row"><div><b>${esc(u.name)}</b></div><div>${esc(u.email)}</div><div><span class="pill">${u.status}</span></div><div>${date}</div><div>${actions}</div></div>`}).join('')||'<div class="empty">Belum ada pengguna.</div>'}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function act(id,action){try{const r=await fetch('/api/admin.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});const d=await r.json();if(!r.ok)throw Error(d.error||'Aksi gagal');msg(action==='approve'?'Akun disetujui.':'Akun ditolak.');load()}catch(e){msg(e.message,true)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await fetch('/api/logout.php',{method:'POST',credentials:'same-origin'});location.href='/'};document.getElementById('backBtn').onclick=()=>location.href='/';load();
</script></body></html>
